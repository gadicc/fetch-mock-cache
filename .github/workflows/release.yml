name: Test & Release
on:
  push:
    branches:
      - main
      - master
      - next
      - next-major
      - beta
      - alpha
      - "[0-9]+.x"
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:
    inputs:
      verify_failure_reporting:
        description: Verify failed/truncated reports; deliberately fail tests and skip publishing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      upload_artifacts: true
      verify_failure_reporting: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure_reporting }}

  release:
    name: Release
    needs: test
    if: ${{ !inputs.verify_failure_reporting }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # tags and releases
      issues: write # semantic-release comments and labels
      pull-requests: write # semantic-release comments and labels
      id-token: write # npm and JSR trusted publishing/provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          package-manager-cache: false

      - name: Use npm for trusted publishing
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: pnpm run build

      - name: Release if relevant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  reports:
    name: Prepare CI report
    needs: test
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.current.outputs.current }}
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - name: Check report still belongs to main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$REPORT_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded report for $REPORT_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout report generator
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: steps.current.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          package-manager-cache: false

      - name: Download coverage
        if: steps.current.outputs.current == 'true'
        continue-on-error: true # failed test jobs may not have produced a report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ needs.test.outputs.artifact_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/report-input

      - name: Download runtime results
        if: steps.current.outputs.current == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-results-${{ needs.test.outputs.artifact_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/report-input

      - name: Generate report and job summary
        if: steps.current.outputs.current == 'true'
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TEST_ARTIFACT_ATTEMPT: ${{ needs.test.outputs.artifact_attempt || github.run_attempt }}
        run: node scripts/ci-report.mjs "$RUNNER_TEMP/report-input" "$RUNNER_TEMP/report-site" "$TEST_RESULT"

      - name: Upload Pages artifact
        if: steps.current.outputs.current == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-site
          retention-days: 1

  deploy-pages:
    name: Deploy CI report
    needs: reports
    # Explicit status function is required even when a failed ancestor's report succeeds.
    if: >-
      !cancelled() && needs.reports.result == 'success' &&
      needs.reports.outputs.current == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-ci-report
      cancel-in-progress: false
    permissions:
      contents: read # recheck the source commit after environment/concurrency waits
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck current main before deployment
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$REPORT_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded report for $REPORT_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy GitHub Pages
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.reports.outputs.artifact_name }}
